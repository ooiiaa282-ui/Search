<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Search</title>
        <!-- Responsive viewport -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body class="display-flex">
        <nav>
            <!-- link to go to image search -->
            <a href="image.html" class="nav-link">Image Search</a>
            <!-- link to go to advanced search -->
            <a href="advanced.html" class="nav-link">Advanced Search</a>
        </nav>
        <div class="container">
        <div class="title">
            <p>Google</p>
        </div>

        <!-- form to search using google -->
        <form action="https://google.com/search" method="get" role="search" class="search-form">
            <input type="text" name="q" autofocus class="search-input">
            <div class="search-buttons">
                <!-- Takes to google search results-->
                <input type="submit" value="Google Search" class="search-submit">
                <!-- I'm feeling lucky sends a hidden value along with the submission -->
                <input type="submit" name="btnI" value="I'm Feeling Lucky" aria-label="I'm Feeling Lucky" class="search-submit">
            </div>
        </form>
        </div>

    </body>
</html>
