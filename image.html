<!DOCTYPE html>
<html lang="en" class="display-flex">
    <head>
        <title>Image Search</title>
        <!-- Responsive viewport -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body class="display-flex">
        <nav>
            <!-- link to go to google search -->
            <a href="index.html" class="nav-link">Google</a>
        </nav>
        <div class="container">
            <div class="title">
                <p>Google</p>
                <h7>images</h7>
            </div>

                <!-- form to search using google image search -->
            <form action="https://google.com/search" class="search-form">
                <!-- takes directly to google image results -->
                <input type="text" name="q" autofocus class="search-input">
                <input type="hidden" name="tbm" value="isch">
                <input type="submit" value="Google Images" class="search-submit">
            </form>
        </div>

    </body>
</html>
