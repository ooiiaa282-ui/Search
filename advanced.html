<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Advanced Search</title>
        <!-- Responsive viewport -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <nav>
            <!-- link to go to google search -->
            <a href="index.html" class="nav-link">Google</a>
        </nav>
        <!-- draw a light grey line -->
        <hr style="border: 1px solid #ccc; width: 100vw; margin: 0;">
        <div class="div1">
            <h1>Advanced Search</h1>
            <form action="https://www.google.com/search">
                <h2>Find pages with</h2>
                <div class="div1" style="padding: 0;">
                    <div class="div2">
                        <!-- label and input for all of these words which its get parameter is as_q -->
                        <label for="as_q">All of these words:</label>
                        <input type="text" name="as_q" id="as_q" autoComplete="off" class="advanced-search-fields">
                    </div>
                    <div class="div2">
                        <!-- label and input for this exact word or phrase which its get parameter is as_epq -->
                        <label for="as_epq">This exact word or phrase:</label>
                        <input type="text" name="as_epq" id="as_epq" autoComplete="off" class="advanced-search-fields">
                    </div>
                    <div class="div2">
                        <!-- label and input for none of these words which its get parameter is as_eq -->
                        <label for="as_eq">None of these words:</label>
                        <input type="text" name="as_eq" id="as_eq" autoComplete="off" class="advanced-search-fields">
                    </div>
                    <div class="div2">
                        <!-- label and input for site or domain which its get parameter is as_sitesearch -->
                        <label for="as_sitesearch">Site or domain:</label>
                        <input type="text" name="as_sitesearch" id="as_sitesearch" autoComplete="off" class="advanced-search-fields">
                    </div>
                    <div>
                        <input type="submit" value="Advanced Search">
                    </div>
                </div>
            </form>
        </div>

    </body>
</html>
